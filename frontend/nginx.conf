server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    resolver fd12::10 valid=30s;

    # SPA: todas las rutas van a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests al backend
    location /api/ {
        set $backend http://backend.railway.internal:8085;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # Proxy iCal requests al backend
    location /ical/ {
        set $backend http://backend.railway.internal:8085;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Cache para assets estaticos
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
